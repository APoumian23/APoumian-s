# Configuración de Apache para el sitio exportado de apoumian.com.
#
# Con `output: "export"` la opción `redirects()` de Next deja de existir: en
# hosting compartido quien resuelve las URLs es Apache, y este archivo es su
# única instrucción. Vive en `public/` para que Next lo copie a la exportación.

# ── Redirecciones ───────────────────────────────────────────────────────────
# /trabajo y /codigo existieron y se fundieron en /casos. Una URL ya publicada
# no se deja morir en un 404: se redirige, para no perder a quien la tenga
# guardada ni el posicionamiento que hubiera ganado.
# Con `Redirect` la coincidencia es por prefijo, y /trabajo/ampa.webp —donde
# viven las capturas de los casos— acabaría en /casos/ampa.webp. `RedirectMatch`
# con ^...$ ata la regla a la ruta exacta y deja las imágenes en paz.
RedirectMatch 301 ^/trabajo/?$ /casos/
RedirectMatch 301 ^/codigo/?$  /casos/

# ── Página de error ─────────────────────────────────────────────────────────
# Sin esto, una ruta inexistente muestra el 404 genérico de Apache, sin la
# marca ni la navegación del sitio.
ErrorDocument 404 /404.html

# ── HTTPS y dominio único ───────────────────────────────────────────────────
# Servir el mismo contenido en http y https, o con y sin www, es contenido
# duplicado a ojos de Google y divide el posicionamiento entre dos direcciones.
<IfModule mod_rewrite.c>
  RewriteEngine On
  RewriteCond %{HTTPS} !=on
  RewriteRule ^(.*)$ https://apoumian.com/$1 [R=301,L]
  RewriteCond %{HTTP_HOST} ^www\.apoumian\.com$ [NC]
  RewriteRule ^(.*)$ https://apoumian.com/$1 [R=301,L]
</IfModule>

# ── Cabeceras de seguridad ──────────────────────────────────────────────────
# Cuatro líneas que el navegador respeta y que no cuestan nada de rendimiento.
<IfModule mod_headers.c>
  # HSTS: después de la primera visita el navegador se niega a hablar por HTTP
  # con este dominio, aunque alguien reescriba el enlace. Ataja el ataque en
  # que un intermediario degrada la conexión antes de que el 301 alcance a
  # correr. `includeSubDomains` cubre auditorias. y tapreviews., que ya tienen
  # su propio certificado; NO se agrega `preload` a propósito: entrar a la
  # lista de precarga de los navegadores es prácticamente irreversible.
  Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

  # nosniff: sin esto el navegador puede decidir por su cuenta que un archivo
  # subido como texto es en realidad JavaScript, y ejecutarlo.
  Header always set X-Content-Type-Options "nosniff"

  # Nadie mete el sitio en un <iframe> ajeno para superponerle botones
  # invisibles y cosechar clics.
  Header always set X-Frame-Options "SAMEORIGIN"

  # Al salir hacia otro dominio se manda el origen, no la ruta completa: que
  # el destino no se entere de qué página interna se estaba viendo.
  Header always set Referrer-Policy "strict-origin-when-cross-origin"

  # El sitio no usa cámara, micrófono ni ubicación. Decirlo cierra la puerta
  # a que un script de terceros los pida en nuestro nombre.
  Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()"
</IfModule>

# ── Compresión ──────────────────────────────────────────────────────────────
<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/css text/plain
  AddOutputFilterByType DEFLATE application/javascript application/json
  AddOutputFilterByType DEFLATE image/svg+xml
</IfModule>

# ── Caché ───────────────────────────────────────────────────────────────────
# Next pone un hash en el nombre de cada archivo de /_next/, así que un cambio
# genera un nombre nuevo: se pueden cachear un año sin miedo a servir viejo.
# El HTML no lleva hash y debe revalidarse siempre, o un cambio de texto
# tardaría días en verse.
<IfModule mod_expires.c>
  ExpiresActive On
  ExpiresByType text/css                "access plus 1 year"
  ExpiresByType application/javascript  "access plus 1 year"
  ExpiresByType image/webp              "access plus 1 year"
  ExpiresByType image/svg+xml           "access plus 1 year"
  ExpiresByType font/woff2              "access plus 1 year"
  ExpiresByType text/html               "access plus 0 seconds"
</IfModule>

# ── El código fuente no se sirve ────────────────────────────────────────────
# En `main` conviven el sitio compilado y el código que lo genera, porque el
# despliegue de Hostinger copia la raíz del repositorio tal cual. Apache solo
# esconde por omisión los archivos que empiezan con «.ht»: sin las reglas de
# abajo, apoumian.com/.env.production se descargaría desde el navegador y
# package.json revelaría cada dependencia y su versión a quien busque una
# vulnerable.
<IfModule mod_rewrite.c>
  RewriteEngine On
  RewriteRule ^(app|lib|public|servidor|node_modules|scripts)/ - [F,L]
  RewriteRule ^\.(env|next|hallmark|git|publicado) - [F,L]
</IfModule>

# Se incluye ^\.ht para no depender de que el host lo bloquee por su cuenta:
# casi todos lo hacen, pero servir este archivo sería regalar el mapa de
# qué rutas se esconden y por qué.
<FilesMatch "(^\.ht|^\.env|^\.publicado|\.(ts|tsx|sh|ya?ml|lock|json|md|toml|log)$)">
  Require all denied
</FilesMatch>

# tokens.css es la fuente del sistema de diseño; lo que sirve el sitio ya viene
# compilado dentro de /_next/static/css.
<Files "tokens.css">
  Require all denied
</Files>

# ── Higiene ─────────────────────────────────────────────────────────────────
Options -Indexes
